<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZEX Reyestr Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Piazzolla:opsz,wght@8..30,400;8..30,500&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
:root {
  --glaze: #EFF4F5;
  --glaze-deep: #DDE7EA;
  --ink: #0F1B3D;
  --ink-soft: #4A5675;
  --cobalt: #15307A;
  --cobalt-deep: #0F2460;
  --cobalt-line: #3A54A0;
  --on-cobalt: #F2F5FB;
  --on-cobalt-soft: #B9C5E6;
  --turquoise: #0B7A80;
  --saffron: #F4B83F;
  --madder: #A5342B;
  --serif: "Piazzolla", Georgia, serif;
  --sans: "Golos Text", "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--glaze);
  color: var(--ink);
  font: 400 16px/1.5 var(--sans);
  display: grid;
  grid-template-columns:
    var(--rail-width, 0px)
    minmax(0, 1fr)
    10px
    clamp(280px, var(--proof-width, 46vw), calc(100vw - var(--rail-width, 0px) - 360px));
  grid-template-rows: minmax(0, 1fr);
  height: 100dvh;
}
body.rail-open { --rail-width: 250px; }
body.is-dragging { cursor: col-resize; user-select: none; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

/* Chats of the current language */
.history {
  grid-column: 1; grid-row: 1; display: none; flex-direction: column; min-height: 0;
  background: var(--glaze-deep); padding: 20px 12px 16px;
}
body.rail-open .history { display: flex; }
.history h2 { margin: 0 0 12px; padding: 0 8px; font: 500 16px/1.3 var(--serif); color: var(--cobalt); }
.new-chat {
  margin: 0 0 12px; padding: 9px 12px; background: #fff; border: 2px solid var(--cobalt); border-radius: 3px;
  color: var(--cobalt); font-weight: 600; font-size: 14px; text-align: left; cursor: pointer;
}
.new-chat:hover { background: var(--cobalt); color: var(--on-cobalt); }
.chat-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; flex: 1; }
.chat-list button {
  display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 8px; background: none; border: 0;
  border-left: 3px solid transparent; border-radius: 0 3px 3px 0; text-align: left; font-size: 14px;
  line-height: 1.35; cursor: pointer;
}
.chat-lang { flex: none; font-size: 11px; font-weight: 600; color: var(--ink-soft); }
.chat-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chat-list button:hover { background: var(--glaze); }
.chat-list button[aria-current="true"] { background: #fff; border-left-color: var(--cobalt); font-weight: 500; }
.history .none { margin: 0; padding: 0 8px; font-size: 14px; color: var(--ink-soft); flex: 1; }

/* Asking side */
.ask { grid-column: 2; grid-row: 1; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.masthead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 20px 40px 12px;
}
.masthead-start { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.rail-toggle {
  flex: none; background: none; border: 0; padding: 4px 10px; border-radius: 3px; cursor: pointer;
  color: var(--ink-soft); font-weight: 500; font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.rail-toggle:hover { color: var(--ink); }
.masthead h1 {
  margin: 0; font: 500 20px/1.2 var(--serif); color: var(--cobalt); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.langs { display: flex; gap: 4px; flex: none; }
.langs button {
  background: none; border: 0; padding: 4px 10px; cursor: pointer; border-radius: 3px;
  color: var(--ink-soft); font-weight: 500; font-size: 14px;
}
.langs button[aria-pressed="true"] { background: var(--cobalt); color: var(--on-cobalt); }

.thread { overflow-y: auto; padding: 12px 40px 24px; scroll-behavior: smooth; }
.intro { max-width: 34em; padding-top: 6vh; }
.intro p { margin: 0 0 28px; font: 400 clamp(22px, 2.1vw, 32px)/1.25 var(--serif); letter-spacing: -0.01em; }
.examples { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--glaze-deep); }
.examples button {
  display: block; width: 100%; padding: 12px 0; background: none; border: 0;
  border-bottom: 1px solid var(--glaze-deep); text-align: left; cursor: pointer; color: var(--cobalt);
}
.examples button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.turn { padding: 20px 0 24px; border-bottom: 1px solid var(--glaze-deep); max-width: 40em; }
.turn:last-child { border-bottom: 0; }
.turn .question { margin: 0 0 10px; color: var(--ink-soft); font-weight: 500; }
.turn .steps { margin: 0; padding: 0; list-style: none; color: var(--ink-soft); font-size: 15px; }
.turn .steps li { padding: 2px 0; }
.turn .steps li:last-child::after { content: "…"; }
.answer { margin: 0; font: 400 clamp(20px, 1.9vw, 25px)/1.42 var(--serif); white-space: pre-line; }
.turn.is-error .answer { font: 400 18px/1.5 var(--sans); color: var(--madder); }
.turn.is-nodata .answer { border-left: 4px solid var(--madder); padding-left: 16px; }
.turn.is-clarify .answer { border-left: 4px solid var(--saffron); padding-left: 16px; }

.fig {
  all: unset; cursor: pointer; font-variant-numeric: tabular-nums;
  background-image: linear-gradient(var(--saffron), var(--saffron));
  background-repeat: no-repeat; background-position: 0 100%; background-size: 100% 3px;
  transition: background-size 160ms ease-out;
}
.fig:hover, .fig:focus-visible, .fig.is-on { background-size: 100% 100%; }
.fig:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

.assumptions { margin: 14px 0 0; padding: 0; list-style: none; font-size: 15px; color: var(--ink-soft); }
.assumptions li { padding: 2px 0; }
.check { margin: 14px 0 0; font-size: 14px; color: var(--turquoise); font-weight: 500; }
.check.is-plain { color: var(--ink-soft); font-weight: 400; }
.turn-actions { margin-top: 10px; }
.turn-actions button {
  background: none; border: 0; padding: 0; color: var(--cobalt); cursor: pointer; font-size: 14px;
  text-decoration: underline; text-underline-offset: 3px;
}
.turn[aria-current="true"] .turn-actions { display: none; }

.composer { padding: 12px 40px 20px; background: var(--glaze); border-top: 1px solid var(--glaze-deep); }
.composer form { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea {
  flex: 1; min-width: 0; min-height: 52px; max-height: 160px; resize: none; overflow-y: hidden; padding: 13px 14px;
  background: #fff; border: 2px solid var(--cobalt); border-radius: 3px; line-height: 1.4;
}
.composer textarea::placeholder { color: var(--ink-soft); }
.composer button {
  height: 52px; padding: 0 22px; border: 0; border-radius: 3px; cursor: pointer;
  background: var(--cobalt); color: var(--on-cobalt); font-weight: 600;
}
.composer button:hover:not(:disabled) { background: var(--cobalt-deep); }
.composer button:disabled { opacity: .55; cursor: progress; }
.notice { margin: 0 0 10px; color: var(--madder); font-size: 14px; }

/* Drag to share the width between the answer and its evidence */
.splitter {
  grid-column: 3; grid-row: 1; position: relative; background: var(--glaze-deep);
  cursor: col-resize; touch-action: none;
}
.splitter::after {
  content: ""; position: absolute; top: 50%; left: 3px; width: 4px; height: 44px; margin-top: -22px;
  border-radius: 2px; background: var(--ink-soft);
}
.splitter:hover, body.is-dragging .splitter { background: var(--saffron); }
.splitter:hover::after, body.is-dragging .splitter::after { background: var(--ink); }
.splitter:focus-visible { outline: 3px solid var(--saffron); outline-offset: -3px; }

/* Evidence side: one tile of solid cobalt */
.proof { grid-column: 4; grid-row: 1; background: var(--cobalt); color: var(--on-cobalt); overflow-y: auto; padding: 24px 32px 40px; min-height: 0; min-width: 0; }
.proof h2 { margin: 0 0 20px; font: 500 20px/1.2 var(--serif); }
.proof .empty { max-width: 28em; color: var(--on-cobalt-soft); }
.step { margin: 0 0 32px; }
.step h3 { margin: 0 0 8px; font: 500 16px/1.4 var(--sans); }
.step .kind { color: var(--on-cobalt-soft); font-weight: 400; font-size: 14px; }
.step pre {
  margin: 0 0 12px; padding: 12px 14px; overflow-x: auto; background: var(--cobalt-deep);
  border-radius: 3px; font: 400 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--on-cobalt);
}
.step .failed { margin: 0 0 12px; color: var(--saffron); font-size: 14px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--on-cobalt-soft); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--cobalt-line); white-space: nowrap; }
td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--cobalt-line); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.is-source { background: var(--saffron); color: var(--ink); box-shadow: -6px 0 0 var(--saffron), 6px 0 0 var(--saffron); }
td.is-null { color: var(--on-cobalt-soft); }
.rows-note { margin: 8px 0 0; color: var(--on-cobalt-soft); font-size: 14px; }

@media (max-width: 900px) {
  html, body { height: auto; }
  body { display: block; height: auto; }
  .ask { display: block; }
  .splitter { display: none; }
  .history { padding: 16px; }
  .chat-list { max-height: 34vh; }
  .masthead { padding: 16px 16px 8px; }
  .masthead-start { gap: 8px; }
  .rail-toggle { padding: 4px 0; }
  .thread { overflow: visible; padding: 8px 16px 16px; }
  .intro { padding-top: 16px; }
  .composer { position: sticky; bottom: 0; padding: 10px 16px 12px; }
  .proof { overflow: visible; padding: 24px 16px 32px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<nav class="history" id="history"></nav>
<main class="ask">
  <header class="masthead">
    <div class="masthead-start">
      <button type="button" class="rail-toggle" id="rail-toggle" aria-controls="history"></button>
      <h1 id="title"></h1>
    </div>
    <div class="langs" role="group" aria-label="Til / Язык">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="uz">UZ</button>
    </div>
  </header>
  <section class="thread" id="thread" aria-live="polite"></section>
  <div class="composer">
    <p class="notice" id="notice" hidden></p>
    <form id="form">
      <textarea id="input" rows="1" maxlength="600"></textarea>
      <button type="submit" id="send"></button>
    </form>
  </div>
</main>
<div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-valuemin="0" aria-valuemax="100"></div>
<aside class="proof" id="proof"></aside>

<script>
const UI = {
  ru: {
    title: "Реестр сделок биржи",
    intro: "Спросите на русском или узбекском о 500 000 сделок за 2022–2026 годы. Ответ строится только на данных, и каждое число можно проверить.",
    examples: [
      "Сколько сделок было в 2025 году и сколько из них аннулировано?",
      "Кто пять крупнейших покупателей хлопка-сырца в 2024 году?",
      "Какая средневзвешенная цена цемента ЦЕМ I 42,5Н в сентябре 2026 года?",
      "Какие были сделки по золоту?"
    ],
    placeholder: "Ваш вопрос о сделках",
    send: "Спросить",
    proof: "На чём основан ответ",
    proofEmpty: "Здесь появятся запросы к данным и их результаты. Наведите на подчёркнутое число в ответе, чтобы увидеть его ячейку в таблице.",
    verified: "Все числа и названия в ответе найдены в результатах запроса",
    fallback: "Показан результат запроса без пересказа: текст модели не прошёл проверку",
    glossary: "Ответ из описания данных, запрос к данным не нужен",
    noEvidence: "Запросов к данным для этого ответа не было.",
    seconds: s => `Ответ за ${s} с`,
    show: "Показать основание",
    kinds: { sql: "Запрос", company: "Поиск компании", broker: "Поиск брокера" },
    rows: (shown, all) => `Показано строк: ${shown} из ${all}`,
    truncated: "В выборке есть ещё строки.",
    noRows: "Запрос не вернул строк.",
    rejected: "Запрос отклонён или завершился ошибкой",
    noKey: "Ключ языковой модели не задан в .env, поэтому вопросы пока не обрабатываются.",
    noDb: "База данных недоступна. Запустите docker compose up -d.",
    failed: "Не удалось получить ответ от сервера. Проверьте соединение и спросите ещё раз.",
    chats: "Чаты",
    newChat: "Новый чат",
    noChats: "Здесь появятся ваши чаты.",
    resize: "Изменить ширину панелей"
  },
  uz: {
    title: "Birja bitimlari reyestri",
    intro: "2022–2026-yillardagi 500 000 ta bitim haqida o‘zbek yoki rus tilida so‘rang. Javob faqat ma’lumotlarga asoslanadi va har bir raqamni tekshirish mumkin.",
    examples: [
      "2025-yilda nechta bitim tuzilgan va ulardan nechtasi bekor qilingan?",
      "2024-yilda paxta xomashyosining eng yirik 5 ta xaridori kim?",
      "Eksport bitimlarining umumiy summasi qancha?",
      "Oltin bo‘yicha qanday bitimlar bo‘lgan?"
    ],
    placeholder: "Bitimlar haqida savolingiz",
    send: "So‘rash",
    proof: "Javob nimaga asoslangan",
    proofEmpty: "Bu yerda ma’lumotlarga so‘rovlar va ularning natijalari chiqadi. Jadvaldagi katagini ko‘rish uchun javobdagi tagiga chizilgan raqam ustiga olib boring.",
    verified: "Javobdagi barcha raqam va nomlar so‘rov natijalarida topildi",
    fallback: "So‘rov natijasi qayta bayon qilinmasdan ko‘rsatildi: model matni tekshiruvdan o‘tmadi",
    glossary: "Javob ma’lumotlar tavsifidan olingan, so‘rov kerak emas",
    noEvidence: "Bu javob uchun ma’lumotlarga so‘rov bo‘lmadi.",
    seconds: s => `Javob ${s} soniyada`,
    show: "Asosini ko‘rsatish",
    kinds: { sql: "So‘rov", company: "Kompaniya qidiruvi", broker: "Broker qidiruvi" },
    rows: (shown, all) => `Ko‘rsatilgan qatorlar: ${shown} / ${all}`,
    truncated: "Natijada yana qatorlar bor.",
    noRows: "So‘rov qator qaytarmadi.",
    rejected: "So‘rov rad etildi yoki xato bilan tugadi",
    noKey: ".env faylida til modeli kaliti ko‘rsatilmagan, shuning uchun savollar hozircha qayta ishlanmaydi.",
    noDb: "Ma’lumotlar bazasi mavjud emas. docker compose up -d ni ishga tushiring.",
    failed: "Serverdan javob olinmadi. Aloqani tekshiring va qayta so‘rang.",
    chats: "Chatlar",
    newChat: "Yangi chat",
    noChats: "Chatlaringiz shu yerda chiqadi.",
    resize: "Panellar kengligini o‘zgartirish"
  }
};

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const MAX_SHOWN_ROWS = 50;
/* Identifiers look numeric but are not quantities: no digit grouping, no figure links. */
const IDENTIFIER_COLUMN = /(^|_)(inn|no|code|year|month|quarter)$/i;
/* Layout only: the model sometimes writes a ranking as "1) … 2) … 3) …" in one paragraph. */
function separateList(text) {
  const start = text.match(/(^|\s)1[.)]\s/);
  if (!start) return text;
  const parts = [];
  let from = start.index + start[1].length;
  const intro = text.slice(0, from).trimEnd();
  for (let n = 2; ; n++) {
    const next = text.slice(from + 2).match(new RegExp(`\\s${n}[.)]\\s`));
    if (!next) break;
    const end = from + 2 + next.index;
    parts.push(text.slice(from, end).trimEnd().replace(/[;,]$/, ""));
    from = end + 1;
  }
  if (!parts.length) return text;
  parts.push(text.slice(from).trimEnd());
  return (intro ? `${intro}\n` : "") + parts.join("\n");
}

/*
 * One list of chats, stored on the server. Each chat has one language: opening it switches the page
 * to that language, and pressing the other language starts a new chat, so the open chat's context
 * never changes under it. Answers still follow the language of each question, as the rules ask.
 */
let chats = [];
const loadedChats = new Map();
let active = null;
let lang = initialLang();
let busy = false;

const currentChat = () => active;
const turns = () => (active ? active.turns : []);

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.status === 204 ? null : res.json();
}

function rememberChat(id) {
  try {
    if (id) localStorage.setItem("uzex-active-chat", id);
    else localStorage.removeItem("uzex-active-chat");
  } catch (e) { /* storage may be blocked */ }
}

async function loadChats() {
  try {
    chats = await api("/api/chats");
  } catch (e) {
    chats = [];
  }
  renderHistory();
}

async function openChat(id) {
  let chat = loadedChats.get(id);
  if (!chat) {
    const data = await api(`/api/chats/${id}`);
    chat = {
      id, lang: data.chat.lang, title: data.chat.title,
      turns: data.turns.map(turn => ({ question: turn.question, response: turn.response })),
      selected: null
    };
    chat.turns.forEach(indexCells);
    chat.selected = chat.turns[chat.turns.length - 1] || null;
    loadedChats.set(id, chat);
  }
  active = chat;
  rememberChat(id);
  applyLanguage(chat.lang);
}

function startNewChat() {
  active = null;
  rememberChat(null);
  renderAll();
  $("input").focus();
}

function chatListItem(chat) {
  const li = el("li");
  const b = el("button");
  b.type = "button";
  b.title = chat.title;
  b.append(el("span", "chat-lang", chat.lang.toUpperCase()), el("span", "chat-title", chat.title));
  if (active && chat.id === active.id) b.setAttribute("aria-current", "true");
  b.addEventListener("click", () => openChat(chat.id).catch(() => loadChats()));
  li.append(b);
  return li;
}

function renderHistory() {
  const t = UI[lang];
  const box = $("history");
  box.textContent = "";
  box.append(el("h2", "", t.chats));
  const fresh = el("button", "new-chat", t.newChat);
  fresh.type = "button";
  fresh.addEventListener("click", startNewChat);
  box.append(fresh);
  if (chats.length) {
    const list = el("ul", "chat-list");
    [...chats].sort((a, b) => b.updatedAt - a.updatedAt).forEach(chat => list.append(chatListItem(chat)));
    box.append(list);
  } else {
    box.append(el("p", "none", t.noChats));
  }
}

function renderAll() {
  renderHistory();
  renderThread();
  renderProof();
}

/* Chats panel: open by default where there is room for it */
function setRailOpen(open, remember) {
  document.body.classList.toggle("rail-open", open);
  $("rail-toggle").setAttribute("aria-expanded", String(open));
  if (remember) {
    try { localStorage.setItem("uzex-rail", open ? "open" : "closed"); } catch (e) { /* storage may be blocked */ }
  }
}

function initialRailOpen() {
  try {
    const saved = localStorage.getItem("uzex-rail");
    if (saved) return saved === "open";
  } catch (e) { /* storage may be blocked */ }
  return window.innerWidth >= 1100;
}

/* The evidence panel's width, kept as a share of the window so it survives a resize */
const MIN_PROOF_PX = 280;
const MIN_CHAT_PX = 360;

function setProofWidth(px, remember) {
  const rail = document.body.classList.contains("rail-open") ? 250 : 0;
  const max = Math.max(MIN_PROOF_PX, window.innerWidth - rail - MIN_CHAT_PX);
  const width = Math.min(max, Math.max(MIN_PROOF_PX, px));
  const share = width / window.innerWidth * 100;
  document.documentElement.style.setProperty("--proof-width", `${share}vw`);
  $("splitter").setAttribute("aria-valuenow", String(Math.round(share)));
  if (remember) {
    try { localStorage.setItem("uzex-proof-width", String(share)); } catch (e) { /* storage may be blocked */ }
  }
}

function initSplitter() {
  const splitter = $("splitter");
  try {
    const saved = parseFloat(localStorage.getItem("uzex-proof-width"));
    if (saved > 0) setProofWidth(saved / 100 * window.innerWidth, false);
  } catch (e) { /* storage may be blocked */ }
  if (!splitter.hasAttribute("aria-valuenow")) splitter.setAttribute("aria-valuenow", "46");

  splitter.addEventListener("pointerdown", e => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    document.body.classList.add("is-dragging");
  });
  splitter.addEventListener("pointermove", e => {
    if (document.body.classList.contains("is-dragging")) setProofWidth(window.innerWidth - e.clientX - 5, false);
  });
  const stop = e => {
    if (!document.body.classList.contains("is-dragging")) return;
    document.body.classList.remove("is-dragging");
    setProofWidth(window.innerWidth - e.clientX - 5, true);
  };
  splitter.addEventListener("pointerup", stop);
  splitter.addEventListener("pointercancel", stop);
  splitter.addEventListener("dblclick", () => setProofWidth(window.innerWidth * 0.46, true));
  splitter.addEventListener("keydown", e => {
    const step = e.shiftKey ? 96 : 24;
    const width = $("proof").offsetWidth;
    if (e.key === "ArrowLeft") setProofWidth(width + step, true);
    else if (e.key === "ArrowRight") setProofWidth(width - step, true);
    else return;
    e.preventDefault();
  });
}

function initialLang() {
  try {
    const saved = localStorage.getItem("lang");
    if (saved === "ru" || saved === "uz") return saved;
  } catch (e) { /* storage may be blocked */ }
  return (navigator.language || "").startsWith("ru") ? "ru" : "uz";
}

function setLang(next) {
  if (next === lang) return;
  if (active && active.lang !== next) {
    active = null;
    rememberChat(null);
  }
  applyLanguage(next);
}

function applyLanguage(next) {
  lang = next;
  try { localStorage.setItem("lang", next); } catch (e) { /* storage may be blocked */ }
  document.documentElement.lang = next;
  const t = UI[next];
  $("title").textContent = t.title;
  $("input").placeholder = t.placeholder;
  $("send").textContent = t.send;
  $("rail-toggle").textContent = t.chats;
  $("splitter").setAttribute("aria-label", t.resize);
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === next)));
  renderAll();
  $("proof").scrollTop = 0;
  scrollToEnd();
  loadStatus();
}

/* Figures: wrap each number of the answer that traces to a result cell. */
const NUMBER = /(\d{1,3}(?:[    ]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)(\s*(?:тыс\.?|тысяч\S*|ming|минг|млн\.?|миллион\S*|mln\.?|million|млрд\.?|миллиард\S*|mlrd\.?|milliard\S*|трлн\.?|триллион\S*|trln\.?|trillion\S*))?/g;

function scaleOf(word) {
  if (!word) return 1;
  const w = word.trim().toLowerCase();
  if (/^(тыс|ming|минг)/.test(w)) return 1e3;
  if (/^(млн|миллион|mln|million)/.test(w)) return 1e6;
  if (/^(млрд|миллиард|mlrd|milliard)/.test(w)) return 1e9;
  return 1e12;
}

function matchCells(digits, word, cells) {
  const compact = digits.replace(/[    ]/g, "").replace(",", ".");
  const shown = parseFloat(compact);
  const decimals = (compact.split(".")[1] || "").length;
  const scale = scaleOf(word);
  if (scale === 1 && decimals === 0 && (shown <= 12 || (shown >= 2022 && shown <= 2026))) return [];
  const half = 0.5 * Math.pow(10, -decimals) * scale;
  return cells.filter(c => Math.abs(c.value - shown * scale) <= half);
}

function renderAnswer(container, turn) {
  container.textContent = "";
  const text = separateList(turn.response.answer);
  const cells = turn.cells || [];
  let last = 0;
  for (const m of text.matchAll(NUMBER)) {
    const before = text[m.index - 1] || "";
    if (/[\p{L}\-.\d]/u.test(before)) continue;
    const hits = matchCells(m[1], m[2], cells);
    if (!hits.length) continue;
    container.append(text.slice(last, m.index));
    const figure = el("button", "fig", m[0]);
    figure.type = "button";
    const on = () => { selectTurn(turn); light(hits, true); };
    const off = () => light(hits, false);
    figure.addEventListener("mouseenter", on);
    figure.addEventListener("focus", on);
    figure.addEventListener("mouseleave", off);
    figure.addEventListener("blur", off);
    figure.addEventListener("click", () => {
      on();
      const first = document.querySelector("td.is-source");
      if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
    });
    container.append(figure);
    last = m.index + m[0].length;
  }
  container.append(text.slice(last));
}

function light(hits, on) {
  hits.forEach(c => {
    const cell = document.querySelector(`td[data-cell="${c.id}"]`);
    if (cell) cell.classList.toggle("is-source", on);
  });
}

/* Collected once per turn so figures and table cells share ids. */
function indexCells(turn) {
  turn.cells = [];
  (turn.response.evidence || []).forEach((step, s) => {
    if (step.kind !== "sql" || !step.result) return;
    step.result.rows.slice(0, MAX_SHOWN_ROWS).forEach((row, r) => row.forEach((value, c) => {
      if (value !== null && !IDENTIFIER_COLUMN.test(step.result.columns[c]) && /^-?\d+(\.\d+)?$/.test(value)) {
        turn.cells.push({ id: `${s}-${r}-${c}`, value: parseFloat(value) });
      }
    }));
  });
}

/* Asking */
function renderThread() {
  const thread = $("thread");
  thread.textContent = "";
  const t = UI[lang];
  if (!turns().length) {
    const intro = el("div", "intro");
    intro.append(el("p", "", t.intro));
    const list = el("ul", "examples");
    t.examples.forEach(q => {
      const li = el("li");
      const b = el("button", "", q);
      b.type = "button";
      b.addEventListener("click", () => ask(q));
      li.append(b);
      list.append(li);
    });
    intro.append(list);
    thread.append(intro);
    return;
  }
  turns().forEach(turn => thread.append(renderTurn(turn)));
}

function renderTurn(turn) {
  const t = UI[lang];
  const node = el("article", "turn");
  turn.node = node;
  node.append(el("p", "question", turn.question));
  if (!turn.response) {
    const steps = el("ul", "steps");
    turn.steps.forEach(label => steps.append(el("li", "", label)));
    node.append(steps);
    return node;
  }
  const r = turn.response;
  if (r.status === "ERROR") node.classList.add("is-error");
  if (r.status === "NO_DATA") node.classList.add("is-nodata");
  if (r.status === "CLARIFY") node.classList.add("is-clarify");
  if (currentChat() && turn === currentChat().selected) node.setAttribute("aria-current", "true");

  const answer = el("p", "answer");
  renderAnswer(answer, turn);
  node.append(answer);

  if (r.assumptions && r.assumptions.length) {
    const list = el("ul", "assumptions");
    r.assumptions.forEach(a => list.append(el("li", "", a)));
    node.append(list);
  }
  const seconds = (r.durationMs / 1000).toFixed(1).replace(".", lang === "ru" ? "," : ".");
  if (r.status === "GLOSSARY") {
    node.append(el("p", "check is-plain", `${t.glossary}. ${t.seconds(seconds)}`));
  } else if (r.source === "FALLBACK") {
    node.append(el("p", "check is-plain", `${t.fallback}. ${t.seconds(seconds)}`));
  } else if (r.status === "ANSWER") {
    node.append(el("p", "check", `✓ ${t.verified}. ${t.seconds(seconds)}`));
  } else if (r.durationMs) {
    node.append(el("p", "check is-plain", t.seconds(seconds)));
  }
  const actions = el("div", "turn-actions");
  const show = el("button", "", t.show);
  show.type = "button";
  show.addEventListener("click", () => selectTurn(turn));
  actions.append(show);
  node.append(actions);
  return node;
}

function selectTurn(turn) {
  const chat = currentChat();
  if (!chat || chat.selected === turn) return;
  chat.selected = turn;
  chat.turns.forEach(x => {
    if (!x.node) return;
    if (x === turn) x.node.setAttribute("aria-current", "true");
    else x.node.removeAttribute("aria-current");
  });
  renderProof();
}

/* Evidence */
function renderProof() {
  const t = UI[lang];
  const proof = $("proof");
  proof.textContent = "";
  proof.append(el("h2", "", t.proof));
  const selected = currentChat() ? currentChat().selected : null;
  if (!selected || !selected.response) {
    proof.append(el("p", "empty", t.proofEmpty));
    return;
  }
  const evidence = selected.response.evidence || [];
  if (!evidence.length) {
    proof.append(el("p", "empty", t.noEvidence));
    return;
  }
  evidence.forEach((step, s) => proof.append(renderStep(step, s, t)));
}

function renderStep(step, s, t) {
  const box = el("section", "step");
  const heading = el("h3");
  heading.append(el("span", "kind", `${t.kinds[step.kind] || step.kind}: `));
  heading.append(step.purpose || (step.kind === "sql" ? "" : step.input));
  box.append(heading);
  if (step.kind === "sql") box.append(el("pre", "", step.input));
  if (step.error) {
    box.append(el("p", "failed", `${t.rejected}: ${step.error}`));
    return box;
  }
  const result = step.result;
  if (!result || !result.rows.length) {
    box.append(el("p", "rows-note", t.noRows));
    return box;
  }
  const numeric = result.columns.map((name, c) => !IDENTIFIER_COLUMN.test(name)
    && result.rows.every(row => row[c] === null || /^-?\d+(\.\d+)?$/.test(row[c])));
  const table = el("table");
  const head = el("tr");
  result.columns.forEach((name, c) => head.append(el("th", numeric[c] ? "num" : "", name)));
  const thead = el("thead");
  thead.append(head);
  const tbody = el("tbody");
  result.rows.slice(0, MAX_SHOWN_ROWS).forEach((row, r) => {
    const tr = el("tr");
    row.forEach((value, c) => {
      const td = el("td", numeric[c] ? "num" : "", value === null ? "—" : value);
      if (value === null) td.classList.add("is-null");
      td.dataset.cell = `${s}-${r}-${c}`;
      tr.append(td);
    });
    tbody.append(tr);
  });
  table.append(thead, tbody);
  const wrap = el("div", "table-wrap");
  wrap.append(table);
  box.append(wrap);
  if (result.rows.length > MAX_SHOWN_ROWS) box.append(el("p", "rows-note", t.rows(MAX_SHOWN_ROWS, result.rows.length)));
  if (result.truncated) box.append(el("p", "rows-note", t.truncated));
  return box;
}

/* Talking to the server */
async function ask(question) {
  if (busy) return;
  busy = true;
  $("send").disabled = true;
  $("input").value = "";
  resizeInput();
  /* A reply may arrive after the user switched chat, so it stays tied to this one. */
  if (!active) active = { id: null, lang, title: question, turns: [], selected: null };
  const chat = active;
  const turn = { question, steps: [], response: null };
  chat.turns.push(turn);
  renderThread();
  scrollToEnd();
  try {
    const res = await fetch("/api/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
      body: JSON.stringify({ question, chatId: chat.id, lang: chat.lang })
    });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    await readEvents(res.body, (event, data) => {
      if (event === "chat") {
        chatSaved(chat, data);
      } else if (event === "step") {
        turn.steps.push(data.label);
        if (chat === currentChat()) {
          renderThread();
          scrollToEnd();
        }
      } else if (event === "final") {
        finish(chat, turn, data);
      }
    });
    if (!turn.response) throw new Error("Stream ended without an answer");
  } catch (e) {
    finish(chat, turn, { status: "ERROR", answer: UI[chat.lang].failed, assumptions: [], evidence: [], durationMs: 0 });
  } finally {
    busy = false;
    $("send").disabled = false;
    $("input").focus();
  }
}

function chatSaved(chat, summary) {
  chat.id = summary.id;
  chat.title = summary.title;
  chat.lang = summary.lang;
  loadedChats.set(chat.id, chat);
  chats = [summary, ...chats.filter(x => x.id !== summary.id)];
  if (chat === active) rememberChat(chat.id);
  renderHistory();
}

function finish(chat, turn, response) {
  turn.response = response;
  indexCells(turn);
  chat.selected = turn;
  const summary = chats.find(x => x.id === chat.id);
  if (summary) summary.updatedAt = Date.now();
  renderHistory();
  if (chat !== currentChat()) return;
  renderThread();
  renderProof();
  $("proof").scrollTop = 0;
  scrollToEnd();
}

async function readEvents(body, onEvent) {
  const reader = body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buffer += value.replace(/\r\n/g, "\n");
    let end;
    while ((end = buffer.indexOf("\n\n")) >= 0) {
      const chunk = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      let event = "message";
      let data = "";
      chunk.split("\n").forEach(line => {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data += line.slice(5);
      });
      if (data) onEvent(event, JSON.parse(data));
    }
  }
}

async function loadStatus() {
  const notice = $("notice");
  try {
    const res = await fetch("/api/status");
    const status = await res.json();
    const t = UI[lang];
    const message = !status.database ? t.noDb : (!status.llmConfigured ? t.noKey : "");
    notice.textContent = message;
    notice.hidden = !message;
  } catch (e) {
    notice.hidden = true;
  }
}

function scrollToEnd() {
  const thread = $("thread");
  thread.scrollTop = thread.scrollHeight;
}

function resizeInput() {
  const input = $("input");
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight + 4, 160)}px`;
  input.style.overflowY = input.scrollHeight + 4 > 160 ? "auto" : "hidden";
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("input").value.trim();
  if (q) ask(q);
});
$("input").addEventListener("input", resizeInput);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("rail-toggle").addEventListener("click", () => {
  setRailOpen(!document.body.classList.contains("rail-open"), true);
  setProofWidth($("proof").offsetWidth, false);
});
setRailOpen(initialRailOpen(), false);
initSplitter();
applyLanguage(lang);

(async () => {
  try { localStorage.removeItem("uzex-chats-v1"); } catch (e) { /* storage may be blocked */ }
  await loadChats();
  let saved = null;
  try { saved = localStorage.getItem("uzex-active-chat"); } catch (e) { /* storage may be blocked */ }
  if (saved && chats.some(chat => chat.id === saved)) {
    await openChat(saved).catch(() => rememberChat(null));
  }
})();
</script>
