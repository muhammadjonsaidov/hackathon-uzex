<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZEX Reyestr Agent</title>
<meta name="description" content="Rus va o‘zbek tillarida birja bitimlari haqidagi savollarga faqat ma’lumotlar asosida javob beradigan agent.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Piazzolla:opsz,wght@8..30,400;8..30,500&display=swap&subset=cyrillic-ext" rel="stylesheet">
<link href="/css/base.css" rel="stylesheet">
<link href="/css/landing.css" rel="stylesheet">
</head>
<body>
<header class="top">
  <a class="brand" href="/" data-t="brand"></a>
  <nav class="top-actions">
    <div class="langs" role="group" aria-label="Til / Язык">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="uz">UZ</button>
    </div>
    <a class="quiet" href="/account?mode=login" data-t="signIn"></a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <h1 data-t="headline"></h1>
      <p class="lead" data-t="lead"></p>
      <form class="ask-box" id="ask-box">
        <label class="visually-hidden" for="ask-input" data-t="askLabel"></label>
        <input id="ask-input" maxlength="600" autocomplete="off">
        <button type="submit" class="primary" data-t="start"></button>
      </form>
      <ul class="try" id="try"></ul>
      <p class="no-signup" data-t="noSignup"></p>
    </div>
    <aside class="demo" aria-labelledby="demo-title">
      <h2 id="demo-title" data-t="demoTitle"></h2>
      <p class="demo-question" data-t="demoQuestion"></p>
      <pre class="demo-part" data-part="1">SELECT COUNT(*) AS all_deals,
  COUNT(*) FILTER (WHERE is_annulled) AS annulled
FROM deals WHERE year = 2025</pre>
      <table class="demo-part" data-part="2">
        <thead><tr><th>all_deals</th><th>annulled</th></tr></thead>
        <tbody><tr><td id="cell-all">115763</td><td id="cell-annulled">8085</td></tr></tbody>
      </table>
      <p class="demo-answer demo-part" data-part="3" id="demo-answer"></p>
      <p class="demo-check demo-part" data-part="4" data-t="demoCheck"></p>
      <p class="demo-hint demo-part" data-part="4"><span data-t="demoHint"></span> <button type="button" class="replay" id="replay" data-t="replay"></button></p>
    </aside>
  </section>

  <section class="steps">
    <h2 data-t="stepsTitle"></h2>
    <ol>
      <li><h3 data-t="step1Title"></h3><p data-t="step1"></p></li>
      <li><h3 data-t="step2Title"></h3><p data-t="step2"></p></li>
      <li><h3 data-t="step3Title"></h3><p data-t="step3"></p></li>
    </ol>
  </section>

  <section class="refusal">
    <div>
      <h2 data-t="refusalTitle"></h2>
      <p data-t="refusal"></p>
    </div>
    <figure>
      <p class="refusal-question" data-t="refusalQuestion"></p>
      <p class="refusal-answer" data-t="refusalAnswer"></p>
    </figure>
  </section>

  <section class="closing">
    <p data-t="data"></p>
    <a class="primary" href="/chat" id="closing-link"></a>
  </section>
</main>

<footer class="bottom">
  <p data-t="footer"></p>
</footer>
<script type="module" src="/js/landing.js"></script>
</body>
</html>
